<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signals Engine</title><style>body{background:#101722;color:#edf3fa;font:1rem/1.6 system-ui;max-width:55rem;margin:2rem auto;padding:1rem}a{color:#8dc9ff}section{background:#192332;padding:1rem;margin:1rem 0;border-radius:10px}select{font:inherit;margin:.4rem}output{display:block;color:#ffcf80}pre{white-space:pre-wrap;font:inherit}</style><main><a href="./">Dashboard</a> · <a href="signal-status.html">Feed status</a><h1>Signals Engine</h1><p>Paper only · Published snapshot, not a live alert</p><label>Asset <select id="asset"><option>BTC</option><option>ETH</option></select></label><label>Strategy <select id="frame"><option value="4">4H Futures</option><option value="1">Daily Core</option></select></label><output id="health" aria-live="polite">Checking data…</output><section><h2>What the engine is watching</h2><pre id="watch"></pre></section><section><h2>Latest published breakout check</h2><p id="decision"></p><p>A breakout check is not a portfolio entry or a paper fill. No decision history is inferred from missing records.</p></section></main><script>
const el=id=>document.getElementById(id);let snapshot;
const stamp=t=>new Date(t).toISOString().replace('T',' ').slice(0,16)+' UTC';
const price=x=>Number.isFinite(x)?x.toLocaleString('en-US',{style:'currency',currency:'USD'}):'unavailable';
function render(){try{const is4=el('frame').value==='4', c=snapshot.coins.find(c=>c.sym===el('asset').value), s=is4?c.setup4h:c.context1d, span=(is4?4:24)*3600000, close=Date.parse(s.asOf)+span, updated=Date.parse(snapshot.updatedAt), now=Date.now();if(!Number.isFinite(close)||close>now||!Number.isFinite(updated)||updated<close||updated>now)throw Error();const stale=now>=close+span+900000;el('health').textContent=(stale?'STALE — expected candle not yet published. ':'')+'Latest published close: '+stamp(close)+' · Next expected after that close: '+stamp(close+span)+' · Snapshot: '+stamp(updated);el('watch').textContent='Long: close strictly above '+price(s.longTrigger)+'\nShort: close strictly below '+price(s.shortTrigger)+'\nTrend filter: long above / short below '+(is4?'4H':'daily')+' SMA200 ('+price(is4?s.sma200_4h:s.sma200)+' at last close; recalculated on the signal close).\nA wick through the level does not qualify.'+(is4?'\nPublished daily gate: '+(s.gateAllows||'unavailable')+'. The actual gate uses data available at the signal bar open.\n1H context only: '+(c.warning1h?.state||'unavailable'):'\nIndependent daily strategy; no 4H confirmation required.');const b=is4?s.lastBreakout:null;el('decision').textContent=b?(b.allowed?'Filters passed':'Blocked: '+(b.blockedBy||'unspecified'))+' · '+b.dir+' · '+stamp(Date.parse(b.at)+span):is4?'No recent breakout record in this snapshot.':'Daily breakout decisions are not included in this feed.';}catch{el('health').textContent='UNAVAILABLE — cannot validate this snapshot.';el('watch').textContent='';el('decision').textContent='';}}
el('asset').onchange=el('frame').onchange=render;fetch('data/signals.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json();}).then(s=>{snapshot=s;render();setInterval(render,30000);}).catch(render);
</script></html>
