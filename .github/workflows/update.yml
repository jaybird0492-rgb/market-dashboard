name: dashboard-update

on:
  push:
    branches: [main]
  schedule:
    # Hourly: refresh live bars, advance both paper accounts (daily + 4H
    # futures), recompute the three-layer signals, commit, deploy.
    # Trades are decided only on closed daily/4H candles inside the bots.
    # Kill switch for all paper trading = delete this schedule block.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch BTC/ETH history + live bars (Binance public data)
        run: |
          node scripts/fetch_history.js --intervals 1d
          node scripts/fetch_history.js --live
      - name: Advance paper accounts + signals
        run: |
          node scripts/v2_paper.js
          node scripts/v2_paper4h.js
          node scripts/v2_signals.js
      - name: Commit paper state
        run: |
          git config user.name "market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v2 web/data
          if git diff --cached --quiet; then
            echo "no paper changes"
          else
            git commit -m "v2 update $(date -u +%Y-%m-%dT%H:%MZ)" || true
            git push origin main || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
