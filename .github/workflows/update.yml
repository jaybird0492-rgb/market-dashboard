name: dashboard-update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# v1's hourly data pipeline (fetch -> setups -> paper bot -> precompute ->
# commit) was deleted with the v1 strategy on 2026-10-29. The site is now a
# static v2 status page; it deploys on push only. A v2 data workflow returns
# when the portfolio test and paper stage are built.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
